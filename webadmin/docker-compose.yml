# HQ Console (webadmin) — chạy toàn bộ hệ thống bằng một lệnh:
#
#   docker compose up --build
#
# Lần đầu chạy: service "migrate" tự động tạo schema + seed dữ liệu demo
# trước khi "api" khởi động. Sau khi tất cả lên, mở http://localhost:3000
# và đăng nhập bằng admin@hq-console.local / ChangeMe123!
#
# Copy .env.example thành .env và đổi JWT_SECRET trước khi dùng thật.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hq_console
      POSTGRES_PASSWORD: hq_console
      POSTGRES_DB: hq_console
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - webadmin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hq_console"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: database/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://hq_console:hq_console@postgres:5432/hq_console?schema=public"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://hq_console:hq_console@postgres:5432/hq_console?schema=public"
      NODE_ENV: production
      JWT_SECRET: "${WEBADMIN_JWT_SECRET:?WEBADMIN_JWT_SECRET phải được đặt trong ops/.env}"
      PORT: "4000"
      WEB_ORIGIN: "http://localhost:3000"
      PROPERTY_WEB_API_URL: "http://host.docker.internal:4100"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY phải được đặt trong ops/.env}"
      IOT_SERVICE_URL: "http://host.docker.internal:4103"
      IOT_SERVICE_API_KEY: "${SERVICE_API_KEY:?SERVICE_API_KEY phải được đặt trong ops/.env}"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:4000"
    restart: unless-stopped
    init: true
    environment:
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  webadmin_postgres_data:
