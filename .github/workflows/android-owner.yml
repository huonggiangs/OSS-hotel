name: Android owner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'smart-hotel-os/mobile/**'
      - '.github/workflows/android-owner.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-hotel-os/mobile/android-owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: anio-owner-debug-apk
          path: smart-hotel-os/mobile/android-owner/app/build/outputs/apk/debug/app-debug.apk
