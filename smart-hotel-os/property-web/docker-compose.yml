# property-web — chạy toàn bộ hệ thống bằng một lệnh (CẦN Docker Desktop đang chạy):
#
#   docker compose up --build
#
# KHÔNG bật được Docker Desktop? Không cần dùng file này — xem README.md mục
# "Chạy thử — Cách 1 (khuyến nghị, không cần Docker)": `npm run dev` trong
# apps/api sẽ tự dùng chế độ database embedded (PGlite), không cần Postgres/Docker.
#
# Cổng khác với webadmin (web 3000/api 4000/postgres 5432) để chạy SONG SONG được
# trên cùng máy: web 3100, api 4100, postgres 5433.
#
# Lần đầu chạy: service "migrate" tự động tạo schema + seed dữ liệu demo trước khi
# "api" khởi động. Sau khi tất cả lên, mở http://localhost:3100 và đăng nhập bằng
# manager / Anio2026@
#
# Copy .env.example thành .env và đổi JWT_SECRET trước khi dùng thật.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: property_web
      POSTGRES_PASSWORD: property_web
      POSTGRES_DB: property_web
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - property_web_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property_web"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: database/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://property_web:property_web@postgres:5432/property_web?schema=public"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://property_web:property_web@postgres:5432/property_web?schema=public"
      NODE_ENV: production
      JWT_SECRET: "${PROPERTY_JWT_SECRET:?PROPERTY_JWT_SECRET phải được đặt trong ops/.env}"
      SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY phải được đặt trong ops/.env}"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY phải được đặt trong ops/.env}"
      PORT: "4100"
      WEB_ORIGIN: "*"
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - property_web_maintenance_uploads:/app/apps/api/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "/api/backend"
        API_PROXY_TARGET: "http://api:4100"
    restart: unless-stopped
    init: true
    environment:
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # Gateway duy nhất công khai ra LAN. Nginx giữ đúng địa chỉ IP client trong
  # X-Forwarded-For cho API, còn API và Next.js vẫn chỉ ở Docker network.
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "3100:3100"
    volumes:
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  property_web_postgres_data:
  property_web_maintenance_uploads:
