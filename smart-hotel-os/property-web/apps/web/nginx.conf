# Public LAN gateway for PMS.  It is the only container bound to port 3100:
# this preserves the real client address before forwarding authenticated API
# calls to the Docker-internal API service.
server {
    listen 3100;
    server_name _;
    client_max_body_size 2m;

    location /api/backend/ {
        # A trailing slash strips /api/backend/ so the API keeps its native
        # /api/v1/... routes.
        proxy_pass http://api:4100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://web:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
