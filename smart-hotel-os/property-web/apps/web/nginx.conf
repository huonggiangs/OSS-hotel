# Public LAN gateway for PMS.  It is the only container bound to port 3100:
# this preserves the real client address before forwarding authenticated API
# calls to the Docker-internal API service.

# Thiết bị IoT (Anionote...) trong LAN: tối đa ~5 yêu cầu/giây mỗi IP (thiết bị hỏi lệnh 3 s/lần + heartbeat)
limit_req_zone $binary_remote_addr zone=device_gw:1m rate=5r/s;

server {
    listen 3100;
    server_name _;
    client_max_body_size 2m;
    # Docker DNS: phân giải lại service sau mỗi lần watcher thay container.
    # Nếu dùng proxy_pass hostname tĩnh, Nginx giữ IP cũ và cổng LAN trả 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/backend/ {
        # A trailing slash strips /api/backend/ so the API keeps its native
        # /api/v1/... routes.
        set $api_upstream http://api:4100;
        rewrite ^/api/backend/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Device Gateway của iot-service (heartbeat / telemetry / commands / ack). Thiết bị xác thực bằng
    # X-Device-Key (iot-service so với hash); gateway chỉ chuyển tiếp đúng tiền tố này — không lộ API quản trị IoT.
    location /device/v1/ {
        limit_req zone=device_gw burst=20 nodelay;
        client_max_body_size 64k;
        set $iot_upstream http://host.docker.internal:4103;
        proxy_pass $iot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location / {
        set $web_upstream http://web:3100;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
